<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Slider Ofertas</title>
    <style>
      :root {
        --color-main: {{mainColor}};
        --animation-time: 1s;
      }
    </style>
    <link rel="stylesheet" href="{{cssUrl}}" />
  </head>
  <body>
    <div class="slider-container" id="slider">{{slides}}</div>
    <script>
      const slider = document.getElementById("slider");

      function startSlider() {
        const slides = document.querySelectorAll(".slide");
        let current = 0;

        setInterval(() => {
          slides[current].classList.remove("active");
          slides[current].classList.add("inactive");
          const randomTime = (Math.random() * 0.6 + 0.9).toFixed(2) + "s";
          document.documentElement.style.setProperty(
            "--animation-time",
            randomTime,
          );
          current = (current + 1) % slides.length;
          slides[current].classList.remove("inactive");
          slides[current].classList.add("active");
        }, 5000); // 5 segundos por oferta
      }

      // Inicializar el slider después de cargar las ofertas
      startSlider();
    </script>
  </body>
</html>
