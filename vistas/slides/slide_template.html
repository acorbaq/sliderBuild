<div class="slide {{active}}">
  <div class="header">
    <div class="logo-container">
      <img class="logo-image" src="{{logoUrl}}" alt="Logo de la tienda" />
    </div>
    <div class="oferta-text">{{titulo}}</div>
  </div>
  <div class="producto-content">
    <div class="product-name">{{nombre}}</div>
    <div class="product-image">
      <img src="{{img}}" alt="{{nombre}}" />
    </div>
    <div class="price-container">
      <div class="price-main">{{precio}}</div>
      <div class="price-currency">{{moneda}}</div>
    </div>
  </div>
</div>
